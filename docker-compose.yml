services:
  atmosense:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atmosense-ai
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
