name: AtmoSense AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: Format, Typecheck, Lint, Unit & UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: Run ESLint and strict checks
        run: npm run lint

      - name: Run full Vitest test suite (unit, integration, a11y, conventions, rules)
        run: npm test

      - name: Build production client bundle
        run: npm run build

  docker-verify:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: quality-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker container image
        run: docker build -t atmosense-ai:ci .
