name: AtmoSense AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: Lint, Typecheck, Unit & UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run ESLint (code + Firestore rules)
        run: npm run lint:eslint

      - name: TypeScript strict check
        run: npm run lint

      - name: Run Vitest & React Testing Library suite
        run: npm run test:ci

      - name: Run Firestore rules invariant test suite
        run: npx tsx --test firestore.rules.test.ts

      - name: Build production client bundle
        run: npm run build

  docker-verify:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: quality-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker container image
        run: docker build -t atmosense-ai:ci .
